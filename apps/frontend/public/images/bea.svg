  <path d="M40.5 5.5a19 19 0 0 1 19 0l27 15.6a19 19 0 0 1 9.5 16.4v6c-14-10-44-18-92 2v-8a19 19 0 0 1 9.5-16.4z" fill="#FBBF24"/>

  <!-- wings -->
  <ellipse cx="21" cy="38" rx="17" ry="7.5" transform="rotate(-28 21 38)" fill="#E0F2FE" stroke="#3B2A06" stroke-width="2.5"/>
  <ellipse cx="79" cy="38" rx="17" ry="7.5" transform="rotate(28 79 38)" fill="#E0F2FE" stroke="#3B2A06" stroke-width="2.5"/>
  <path d="M12 42 Q20 38 28 38" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M88 42 Q80 38 72 38" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round"/>

  <!-- antennae -->
  <path d="M43 32 Q40 20 33 16" fill="none" stroke="#3B2A06" stroke-width="3" stroke-linecap="round"/>
  <path d="M57 32 Q60 20 67 16" fill="none" stroke="#3B2A06" stroke-width="3" stroke-linecap="round"/>
  <circle cx="33" cy="16" r="4" fill="#DB2777"/>
  <circle cx="67" cy="16" r="4" fill="#DB2777"/>

  <!-- head, with a striped collar -->
  <circle cx="50" cy="56" r="27" fill="#FFE066" stroke="#3B2A06" stroke-width="3"/>
  <path d="M29 73 L71 73 A27 27 0 0 1 64.1 79 L35.9 79 A27 27 0 0 1 29 73 Z" fill="#3B2A06"/>

  <!-- blush -->
  <ellipse cx="31" cy="59" rx="4.5" ry="2.8" fill="#F472B6" fill-opacity="0.55"/>
  <ellipse cx="69" cy="59" rx="4.5" ry="2.8" fill="#F472B6" fill-opacity="0.55"/>

