  <path d="M48.5 49.5 Q50 47.5 51.5 49.5" fill="none" stroke="#3B2A06" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="51" r="3.2" fill="#3B2A06"/>
  <circle cx="60" cy="51" r="3.2" fill="#3B2A06"/>
  <circle cx="41.2" cy="49.8" r="1.1" fill="#FFFFFF"/>
  <circle cx="61.2" cy="49.8" r="1.1" fill="#FFFFFF"/>

  <!-- smile -->
  <path d="M44 61 Q50 66 56 61" fill="none" stroke="#3B2A06" stroke-width="2.5" stroke-linecap="round"/>
