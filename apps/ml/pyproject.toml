[project]
name = "hobbyhive-ml"
version = "0.1.0"
description = "HobbyHive topic model: post embeddings, hive classification, and off-topic detection"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed>=0.7",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "matplotlib>=3.9",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
